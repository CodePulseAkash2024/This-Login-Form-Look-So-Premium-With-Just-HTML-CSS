<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Login Form</title>
  <link rel="stylesheet" href="style.css">
  <style>

  </style>
</head>
<body>
  <form class="form" onsubmit="event.preventDefault(); alert('Demo login form');">
    <header class="login-header">
      <h1 class="login-title">LOGIN</h1>
      <p class="login-subtitle">Log in to your account</p>
    </header>

    <div class="field">
      <label for="email">EMAIL</label>
      <input id="email" name="email" type="email" placeholder="Enter your email" autocomplete="username" required>
    </div>

    <div class="field">
      <label for="password">PASSWORD</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
      <div class="forgot-row"><a href="#forgot-password">Forgot password?</a></div>
    </div>

    <button class="login-button" type="submit">Log In</button>

    <p class="signup-text">Don't have an account? <a href="#signup">Sign Up</a></p>

    <nav class="social-links" aria-label="Social media links">
      <a href="#facebook" aria-label="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0a12 12 0 0 0-2 23.83v-8.44H7.1v-3.4H10V9.4c0-2.87 1.7-4.46 4.32-4.46 1.25 0 2.56.22 2.56.22v2.82h-1.44c-1.42 0-1.86.88-1.86 1.78v2.14h3.17l-.51 3.4h-2.66v8.45A12 12 0 0 0 12 0z"/></svg>
      </a>
      <a href="#instagram" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6zm5.2-3.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg>
      </a>
      <a href="#linkedin" aria-label="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 2H3.55A1.55 1.55 0 0 0 2 3.55v16.9A1.55 1.55 0 0 0 3.55 22h16.9A1.55 1.55 0 0 0 22 20.45V3.55A1.55 1.55 0 0 0 20.45 2zM8 19H4.8V9.4H8V19zM6.4 8.1a1.85 1.85 0 1 1 0-3.7 1.85 1.85 0 0 1 0 3.7zM19.2 19H16v-4.67c0-1.11-.02-2.54-1.55-2.54-1.55 0-1.79 1.21-1.79 2.46V19H9.47V9.4h3.06v1.31h.04a3.36 3.36 0 0 1 3.02-1.66c3.23 0 3.83 2.13 3.83 4.9V19z"/></svg>
      </a>
    </nav>
  </form>
</body>
</html>
